pre-commit:
  jobs:
    - name: "skir-format"
      glob: "{lefthook.yml,skir-src/**/*.skir}"
      run: bunx skir@1.2 format --ci
    - name: "skir-snapshot"
      glob: "{lefthook.yml,skir-src/**/*.skir}"
      run: bunx skir@1.2 snapshot --ci
    - name: "server-format"
      glob: "{lefthook.yml,server/**/*.{gleam,toml}}"
      run: cd server && gleam format --check
    - name: "server-type-check"
      glob: "{lefthook.yml,server/**/*.{gleam,toml}}"
      run: cd server && gleam check
    - name: "server-lint"
      glob: "{lefthook.yml,server/**/*.{gleam,toml}}"
      run: cd server && gleam run -m lint
    - name: "server-test"
      glob: "{lefthook.yml,server/**/*.{gleam,toml}}"
      run: cd server && gleam test
    - name: "webclient-format"
      glob: "{lefthook.yml,client-web/**/*.{ts,tsx,json}}"
      run: cd client-web && bun run format:check
    - name: "webclient-type-check"
      glob: "{lefthook.yml,client-web/**/*.{ts,tsx,json}}"
      run: cd client-web && bun x --no-install tsc --noEmit
    - name: "webclient-lint"
      glob: "{lefthook.yml,client-web/**/*.{ts,tsx}}"
      run: cd client-web && bun run lint
    - name: "webclient-test"
      glob: "{lefthook.yml,client-web/**/*.{ts,tsx,json}}"
      run: cd client-web && bun run test:run
