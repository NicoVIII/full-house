name: CI

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Toolchain/runtime version pins (edit here to upgrade in one place)
  GLEAM_VERSION: "1.16.0"
  OTP_VERSION: "27"
  REBAR3_VERSION: "3"
  BUN_VERSION: "latest"

jobs:
  skir-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run Skir format checker
        run: ./skir.sh format --ci
      - name: Ensure Skir snapshot up-to-date
        run: ./skir.sh snapshot --ci

  server-test:
    needs: [skir-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          gleam-version: ${{ env.GLEAM_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}
      - name: Cache server dependencies
        uses: actions/cache@v5
        with:
          path: |
            server/build/packages
            server/build/dev/erlang
          key: ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-${{ hashFiles('server/manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-${{ env.OTP_VERSION }}-${{ env.GLEAM_VERSION }}-
      - name: Check format
        run: gleam format --check src test
      - name: Generate skir
        run: cd .. && ./skir.sh gen
      - name: Download dependencies
        run: gleam deps download
      - name: Type check
        run: gleam check
      - name: Lint
        run: gleam run -m lint
      - name: Run tests
        run: gleam test

  frontend-test:
    needs: [skir-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client-web
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache client-web dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('client-web/package.json', 'client-web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: Generate skir
        run: cd .. && ./skir.sh gen
      - name: Type check
        run: bun run type-check
      - name: Lint
        run: bun run lint
      - name: Dead code check
        run: bun run check:deadcode
      - name: Run tests
        run: bun run test:run

  build-and-push:
    needs: [server-test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
